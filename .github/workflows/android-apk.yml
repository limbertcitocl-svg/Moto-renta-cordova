name: Generar APK Moto Renta Cordova

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Android SDK
        run: echo "Usar Android SDK preinstalado"

      - name: Instalar dependencias
        run: npm install --no-audit

      - name: Preparar archivos web
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const config = JSON.parse(
            fs.readFileSync('capacitor.config.json', 'utf8')
          );
          const webDir = config.webDir || 'www';
          fs.mkdirSync(webDir, { recursive: true });
          fs.copyFileSync(
            'index.html',
            path.join(webDir, 'index.html')
          );
          NODE

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Sincronizar Android
        run: npx cap sync android
      
      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: Moto-Renta-Cordova-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
